name: Deploy FitFarmHQ Frontends

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [central, admin, member]
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.fitfarmhq.com/api/v1' }}
      NEXT_PUBLIC_PLATFORM_DOMAIN: ${{ secrets.NEXT_PUBLIC_PLATFORM_DOMAIN || 'fitfarmhq.com' }}
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
      NEXT_PUBLIC_ADMIN_APP_URL: ${{ secrets.NEXT_PUBLIC_ADMIN_APP_URL || 'https://admin.fitfarmhq.com' }}
      NEXT_PUBLIC_MEMBER_APP_URL: ${{ secrets.NEXT_PUBLIC_MEMBER_APP_URL || 'https://fitfarmhq.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Build static export
        working-directory: apps/${{ matrix.app }}
        run: npm run build

      - name: Verify static export exists
        working-directory: apps/${{ matrix.app }}
        run: |
          test -f out/index.html || { echo "::error::out/index.html is missing"; exit 1; }
          echo "out/ ready for ${{ matrix.app }}"

      - name: Validate SSH secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_HOST" || { echo "::error::SSH_HOST secret is missing"; exit 1; }
          test -n "$SSH_USER" || { echo "::error::SSH_USER secret is missing"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::SSH_PRIVATE_KEY secret is missing"; exit 1; }

      - name: Prepare SSH key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync to Hostinger
        env:
          TARGET_DIR: ${{ matrix.app == 'central' && '.' || matrix.app }}
        run: |
          TARGET="domains/fitfarmhq.com/public_html/${TARGET_DIR}"
          if [ -n "${{ secrets.SSH_TARGET_ROOT }}" ]; then
            TARGET="${{ secrets.SSH_TARGET_ROOT }}/${TARGET_DIR}"
          fi

          EXCLUDES=""
          if [ "${{ matrix.app }}" = "central" ]; then
            # Central shares its document root with the API and the admin/member exports.
            EXCLUDES="--exclude api --exclude admin --exclude member"
          fi

          echo "Deploying ${{ matrix.app }} -> $TARGET"
          rsync -az --delete --delay-updates $EXCLUDES \
            -e "ssh -p ${{ secrets.SSH_PORT || '65002' }} -i ~/.ssh/id_ed25519" \
            "apps/${{ matrix.app }}/out/" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${TARGET}/"
